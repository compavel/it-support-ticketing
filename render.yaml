services:
  - type: web
    name: it-support-ticketing
    runtime: php
    plan: free
    buildCommand: >
      composer install --no-dev --prefer-dist --optimize-autoloader &&
      npm install &&
      npm run build &&
      php artisan migrate --force
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://it-support-ticketing.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
    autoDeploy: true

databases:
  - name: it-support-ticketing-db
    plan: free
    databaseName: it_support_ticketing
